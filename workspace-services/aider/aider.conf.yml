# Plantilla. Copia como .aider.conf.yml en la raiz de tu repo si prefieres no
# usar 'svc aider'. Los modelos son ALIAS de roles de la BD (cada uno con su
# escalera y su cooldown en LiteLLM).
openai-api-base: http://localhost:4000/v1
# La key se pasa por entorno: OPENAI_API_KEY = tu LITELLM_MASTER_KEY

model: openai/architect          # planifica (escalera fuerte: calidad >= 4)
editor-model: openai/backend     # aplica los diffs (escalera media)
weak-model: openai/boilerplate   # commits / resumenes (escalera barata + local)

architect: true
auto-accept-architect: true
show-model-warnings: false
cache-prompts: true              # menos tokens en llamadas repetidas
read:
  - AGENTS.md                    # tus directrices como contexto de solo lectura
