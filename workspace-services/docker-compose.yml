# Servicios de apoyo. Arranque de un clic:  ./svc up
services:
  litellm:                                  # gateway de modelos (endpoint OpenAI)
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    ports: ["4000:4000"]
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - GITHUB_API_KEY=${GITHUB_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - PRIVATE_API_KEY=${PRIVATE_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-master}
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agent}
      - POSTGRES_DB=agentdb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  converter:                                # conversion de documentos -> Markdown (REST)
    build: ./converter
    restart: unless-stopped
    ports: ["8080:8080"]

  # Opcional: mismo motor expuesto como servidor MCP para que los agentes
  # conviertan documentos por si mismos. Añadelo en Cline como MCP server
  # apuntando a http://localhost:3001/mcp
  # converter-mcp:
  #   build: ./converter
  #   command: ["markitdown-mcp", "--http", "--host", "0.0.0.0", "--port", "3001"]
  #   ports: ["3001:3001"]

volumes:
  pgdata:
