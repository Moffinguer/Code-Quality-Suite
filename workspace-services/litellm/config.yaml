# Gateway LiteLLM: un unico endpoint OpenAI-compatible por delante de varios
# modelos (potente / barato / local / privado) con fallback automatico.
# Ajusta los identificadores de modelo a los actuales de tu proveedor.
model_list:
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gpt
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: cheap
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: strong
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free # verifica el slug en openrouter.ai/models
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: local
    litellm_params:
      model: ollama/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - strong: [gemini, gpt, cheap]
    - gpt: [gemini, cheap]
    - cheap: [gemini]

litellm_settings:
  drop_params: true
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
