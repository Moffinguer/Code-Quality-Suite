# =============================================================================
# POOL COMPLETO de modelos. Filosofia "set and forget":
#   - Apila muchos modelos de muchos proveedores. Cada modelo y cada proveedor
#     tiene su propio cupo, asi que apilar MULTIPLICA el presupuesto diario.
#   - El fallback va de mas potente a mas liviano y CRUZA proveedores.
#   - cooldown + allowed_fails apartan el modelo agotado/muerto 5 min: se
#     auto-repara. Los slugs que ya no existan fallan una vez y se aparcan solos.
#
# En Cline pon Model ID = "auto". Rellena en .env SOLO las keys que tengas;
# los modelos sin key fallan una vez y se saltan.
# Para AÑADIR modelos: otra linea en model_list + su nombre en el fallback de "auto".
# =============================================================================
model_list:
  # ===== ENTRADA (lo que usa Cline) =====
  - { model_name: auto,           litellm_params: { model: gemini/gemini-3.5-flash,      api_key: os.environ/GEMINI_API_KEY } }

  # ===== Google Gemini (potentes; ~20 req/dia CADA UNO en free) =====
  - { model_name: gemini-36,      litellm_params: { model: gemini/gemini-3.6-flash,      api_key: os.environ/GEMINI_API_KEY } }
  - { model_name: gemini-25,      litellm_params: { model: gemini/gemini-2.5-flash,      api_key: os.environ/GEMINI_API_KEY } }
  - { model_name: gemini-20,      litellm_params: { model: gemini/gemini-2.0-flash,      api_key: os.environ/GEMINI_API_KEY } }
  - { model_name: gemini-l31,     litellm_params: { model: gemini/gemini-3.1-flash-lite, api_key: os.environ/GEMINI_API_KEY } }
  - { model_name: gemini-l25,     litellm_params: { model: gemini/gemini-2.5-flash-lite, api_key: os.environ/GEMINI_API_KEY } }
  - { model_name: gemini-l20,     litellm_params: { model: gemini/gemini-2.0-flash-lite, api_key: os.environ/GEMINI_API_KEY } }

  # ===== Cerebras (muy rapido, ~1M tokens/dia; catalogo volatil) =====
  - { model_name: cerebras-oss,   litellm_params: { model: cerebras/gpt-oss-120b,        api_key: os.environ/CEREBRAS_API_KEY } }
  - { model_name: cerebras-llama, litellm_params: { model: cerebras/llama-3.3-70b,       api_key: os.environ/CEREBRAS_API_KEY } }

  # ===== Groq (rapido; TPM 12k en free) =====
  - { model_name: groq-oss120,    litellm_params: { model: groq/openai/gpt-oss-120b,     api_key: os.environ/GROQ_API_KEY } }
  - { model_name: groq-oss20,     litellm_params: { model: groq/openai/gpt-oss-20b,      api_key: os.environ/GROQ_API_KEY } }
  - { model_name: groq-llama70,   litellm_params: { model: groq/llama-3.3-70b-versatile, api_key: os.environ/GROQ_API_KEY } }
  - { model_name: groq-qwen32,    litellm_params: { model: groq/qwen3-32b,               api_key: os.environ/GROQ_API_KEY } }
  - { model_name: groq-llama8,    litellm_params: { model: groq/llama-3.1-8b-instant,    api_key: os.environ/GROQ_API_KEY } }

  # ===== OpenRouter (variedad; :free rota, verifica en openrouter.ai/models) =====
  - { model_name: or-deepseek-r1, litellm_params: { model: openrouter/deepseek/deepseek-r1:free,               api_key: os.environ/OPENROUTER_API_KEY } }
  - { model_name: or-deepseek-v3, litellm_params: { model: openrouter/deepseek/deepseek-chat-v3:free,          api_key: os.environ/OPENROUTER_API_KEY } }
  - { model_name: or-llama70,     litellm_params: { model: openrouter/meta-llama/llama-3.3-70b-instruct:free,  api_key: os.environ/OPENROUTER_API_KEY } }
  - { model_name: or-gemma,       litellm_params: { model: openrouter/google/gemma-3-27b-it:free,              api_key: os.environ/OPENROUTER_API_KEY } }

  # ===== Mistral (coding; Experiment tier, requiere opt-in a training) =====
  - { model_name: mistral-codestral, litellm_params: { model: mistral/codestral-latest,     api_key: os.environ/MISTRAL_API_KEY } }
  - { model_name: mistral-large,     litellm_params: { model: mistral/mistral-large-latest, api_key: os.environ/MISTRAL_API_KEY } }

  # ===== DeepSeek API propia (DE PAGO, baratisima; sin limites de free) =====
  - { model_name: deepseek-paid,  litellm_params: { model: deepseek/deepseek-chat,        api_key: os.environ/DEEPSEEK_API_KEY } }

  # ===== GitHub Models (gpt-4o-mini real; requiere GITHUB_API_KEY = PAT) =====
  - { model_name: gh-gpt4omini,   litellm_params: { model: github/gpt-4o-mini,            api_key: os.environ/GITHUB_API_KEY } }

  # ===== Ollama LOCAL (gratis, ilimitado, privado; colchon definitivo) =====
  - { model_name: local,          litellm_params: { model: ollama/qwen2.5-coder:14b, api_base: http://host.docker.internal:11434 } }

router_settings:
  routing_strategy: simple-shuffle
  cooldown_time: 300
  allowed_fails: 1
  fallbacks:
    - auto: [gemini-36, gemini-25, gemini-20, cerebras-oss, cerebras-llama,
             groq-oss120, groq-llama70, or-deepseek-r1, or-deepseek-v3, mistral-codestral,
             or-llama70, or-gemma, groq-qwen32, gemini-l31, gemini-l25, gemini-l20,
             groq-oss20, groq-llama8, mistral-large, gh-gpt4omini, deepseek-paid, local]

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
