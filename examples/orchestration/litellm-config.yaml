# Gateway LiteLLM: un unico endpoint OpenAI-compatible por delante de varios
# modelos (potente / barato / local / privado) con fallback automatico.
# Ajusta los identificadores de modelo a los actuales de tu proveedor.
model_list:
  - model_name: strong                       # tareas dificiles
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: cheap                        # tareas simples / cuando se agota lo caro
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: local                        # modelo local via Ollama
    litellm_params:
      model: ollama/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434
  - model_name: private                      # tu servidor privado (compatible OpenAI)
    litellm_params:
      model: openai/mi-modelo
      api_base: https://mi-servidor-privado.example/v1
      api_key: os.environ/PRIVATE_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  # Si "strong" falla o se agota -> baja a cheap, luego a local:
  fallbacks:
    - strong: [cheap, local]
    - cheap: [local]

litellm_settings:
  drop_params: true
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
