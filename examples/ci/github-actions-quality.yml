# Copy to .github/workflows/quality.yml of the target repository.
# Assumes the suite lives in ./code-quality-suite (submodule or vendored copy).
# ci-check.sh builds the base image and installs only the languages it finds.
name: quality
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"      # weekly full scan (Monday 03:00 UTC)

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # needed for the diff against the base
          persist-credentials: false
      - name: Check
        env:
          QUALITY_SUITE_DIR: ${{ github.workspace }}/code-quality-suite
          QUALITY_SUITE_IMAGE: code-quality-suite:ci
          QS_RULES_FILE: .quality-rules.json   # commit it so CI applies the same rules
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ALL=1 ./code-quality-suite/scripts/ci-check.sh
          else
            git fetch --no-tags origin "${{ github.base_ref || 'main' }}" || true
            ./code-quality-suite/scripts/ci-check.sh "origin/${{ github.base_ref || 'main' }}"
          fi

