# Include or copy into your .gitlab-ci.yml. Needs Docker-in-Docker.
stages: [quality]

quality:
  stage: quality
  image: docker:27
  services: [docker:27-dind]
  variables:
    QUALITY_SUITE_DIR: "$CI_PROJECT_DIR/code-quality-suite"
    QUALITY_SUITE_IMAGE: code-quality-suite:ci
    QS_RULES_FILE: .quality-rules.json
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git bash coreutils
  script:
    - ./code-quality-suite/scripts/ci-check.sh "origin/$CI_DEFAULT_BRANCH"
